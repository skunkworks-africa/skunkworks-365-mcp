name: Publish approved runtime image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci --ignore-scripts && npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ghcr.io/skunkworks-africa/skunkworks-365-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/skunkworks-africa/skunkworks-365-mcp
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Save immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "ghcr.io/skunkworks-africa/skunkworks-365-mcp@$DIGEST" > image-reference.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image-reference.txt
