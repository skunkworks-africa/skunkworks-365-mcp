name: Cloud Manager prototype tests

on:
  pull_request:
    paths:
      - 'cloud-manager/**'
      - '.github/workflows/cloud-manager-ci.yml'
  push:
    branches: [main]
    paths:
      - 'cloud-manager/**'
      - '.github/workflows/cloud-manager-ci.yml'

permissions:
  contents: read

jobs:
  prototype-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type-check Cloud Manager
        run: npx --no-install tsc --project cloud-manager/tsconfig.json
      - name: Run isolated prototype tests
        working-directory: cloud-manager
        run: node --test test/*.test.mjs

