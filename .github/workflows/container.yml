name: Container build
on:
  pull_request:
    paths: ['src/**', 'package*.json', 'tsconfig.json', 'Dockerfile', '.dockerignore', '.github/workflows/container.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: skunkworks-365-mcp:test
